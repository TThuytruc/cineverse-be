on:
  pull_request:
    branches:
      - deploy
  push:
    branches:
      - deploy

name: "Build & Release spring app image to docker hub"
jobs:
  build:
    name: Build & Release spring app image to docker hub
    runs-on: ubuntu-latest #windows-latest
    steps:
      # 1. checkout source code in repository
      - uses: actions/checkout@v3

      # create file .env
      - name: Create .env file
        run: |
          echo "FIREBASE_ANDROID_API_KEY=${{ secrets.FIREBASE_ANDROID_API_KEY }}" >> ./.env
          echo "FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}" >> ./.env
          echo "FIREBASE_ANDROID_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_ANDROID_MESSAGING_SENDER_ID }}" >> ./.env
          echo "FIREBASE_ANDROID_PROJECT_ID=${{ secrets.FIREBASE_ANDROID_PROJECT_ID }}" >> ./.env
          echo "FIREBASE_ANDROID_STORAGE_BUCKET=${{ secrets.FIREBASE_ANDROID_STORAGE_BUCKET }}" >> ./.env
          echo "GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" >> ./.env
          echo "JARVIS_URL=${{ secrets.JARVIS_URL }}" >> ./.env
          echo "KNOWLEDGE_URL=${{ secrets.KNOWLEDGE_URL }}" >> ./.env
      
      # Load Google Service file
      # - name: Load Google Service file
      #   env:
      #     DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
      #   run: |
      #     echo $env:DATA | Out-File -FilePath google-services-base64.txt
      #     $base64 = Get-Content google-services-base64.txt
      #     [System.Convert]::FromBase64String($base64) | Set-Content -Path ./android/app/google-services.json -AsByteStream
      #     Get-Content ./android/app/google-services.json

      #echo $DATA | base64 -di > ./android/app/google-services.json
      
      # 2. install Java
      - uses: actions/setup-java@v3
        with:
          java-version: '17.x'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean install -DskipTests
      
      # 3. Build Docker image
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build Docker image
        run: docker build -t spring-app .
       
   

      # 4. config Flutter and check environment
      - run: flutter config --no-analytics
      - run: flutter doctor

      # 5. install dependencies
      - run: flutter pub get

      # # 6. run automation testing
      # - run: flutter test

      # 7. Build APK debug and AAB
      - run: flutter build apk --debug --split-per-abi
      - run: flutter build appbundle --release

      # 8. Push APK Debug into GitHub Releases
      - name: Push to Debug Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/debug/*"
          tag: v1.0.${{ github.run_number }}-apk-debug-${{ github.sha }}
          token: ${{ secrets.TOKEN_CICD }}
      
      # 9. Push APK Release and AAB into GitHub Releases
      # - name: Push to Release
      #   uses: ncipollo/release-action@v1
      #   with:
      #     artifacts: |
      #       build/app/outputs/apk/release/*.apk
      #       build/app/outputs/bundle/release/*.aab
      #     tag: v1.0.${{ github.run_number }}-aab-apk-release-${{ github.sha }}
      #     token: ${{ secrets.TOKEN_CICD }}
        
       # 10. Deploy APK into Firebase App Distribution
      - name: Deploy APK to Firebase
        run: firebase appdistribution:distribute  ./build/app/outputs/apk/debug/app-x86_64-debug.apk --app ${{ secrets.FIREBASE_ANDROID_APP_ID }}  #--release-notes "Release notes for this build AMD2024"
      #  --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} ./build/app/outputs/bundle/release/app-release.aab        
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

#Warning: Artifact pattern :build/app/outputs/apk/release/*.apk did not match any files
spring.application.name=cineverse-be
spring.config.import=optional:file:.env[.properties]

# Swagger
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.enabled=${HAS_SWAGGER}

# Firebase
com.example.firebase.web-api-key=${WEB_API_KEY}
com.example.firebase.private-key=${FIREBASE_CREDENTIALS_JSON}

## TMDB
tmdb.api.base-image-url=https://image.tmdb.org/t/p/
tmdb.api.original-image-url=https://image.tmdb.org/t/p/original/

# DATABASE
spring.data.mongodb.uri=${DATABASE_URI}

ai-service.api.base-url=${AI_SERVICE_BASE_URL}

llm.api.key=${LLM_API_KEY}

resend.api.key=${RESEND_API_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

domain.auth.callback-url=${DOMAIN_AUTH_CALLBACK_URL}